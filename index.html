    <script>
      // Suppress Vite HMR WebSocket connection notices in cloud iframe environment
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && a.message) || String(a);
          }).join(' ');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason && (event.reason.message || String(event.reason));
          if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1 || reason.indexOf('closed without opened') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
