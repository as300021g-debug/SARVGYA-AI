    <script>
      // Cleanly filter Vite HMR WebSocket notices in cloud iframe reverse-proxy environment
      (function() {
        var isWsNoise = function(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || String(val));
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('[vite] failed to connect') !== -1 ||
            str.indexOf('[vite] connecting...') !== -1
          );
        };

        var filterArgs = function(args) {
          return Array.prototype.slice.call(args).some(isWsNoise);
        };

        var origError = console.error;
        console.error = function() {
          if (filterArgs(arguments)) return;
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          if (filterArgs(arguments)) return;
          origWarn.apply(console, arguments);
        };

        var origInfo = console.info;
        console.info = function() {
          if (filterArgs(arguments)) return;
          origInfo.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsNoise(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (isWsNoise(event.message) || isWsNoise(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
